services:
  postgres:
    image: icy-postgres:latest
    container_name: icy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    image: icy-backend:latest
    build:
      context: ./backend
    container_name: icy-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    image: icy-frontend:latest
    build:
      context: ./frontend
    container_name: icy-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:

  